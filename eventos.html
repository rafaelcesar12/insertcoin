<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsertCoin — Eventos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="assets/brand.png">
  <style>
    body { background: var(--bg); }
    .bg-grid { position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,200,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,200,0.025) 1px,transparent 1px);background-size:50px 50px;pointer-events:none; }
    .topbar { position:sticky;top:0;z-index:100;background:rgba(5,5,16,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px; }
    .topbar-logo { font-family:var(--font-head);font-size:16px;font-weight:900;letter-spacing:0.1em;color:var(--neon-green);text-shadow:var(--glow-green); }
    .topbar-nav { display:flex;gap:8px; }

    .page-wrap { max-width:1000px;margin:0 auto;padding:24px 20px;position:relative;z-index:1; }
    h1 { font-family:var(--font-head);font-size:18px;font-weight:900;letter-spacing:0.1em;color:var(--text);margin-bottom:6px; }
    h1 span { color:var(--neon-green);text-shadow:var(--glow-green); }
    .subtitle { color:var(--text-muted);font-size:13px;margin-bottom:24px; }

    .games-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px; }
    .game-card {
      background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);
      padding:22px;text-decoration:none;display:block;transition:border-color var(--transition), transform var(--transition);
    }
    .game-card:hover { border-color:var(--border-hot);transform:translateY(-3px); }
    .game-card .emoji { font-size:2rem; }
    .game-card h2 { font-family:var(--font-head);font-size:14px;color:var(--neon-green);margin:10px 0 6px;letter-spacing:0.05em; }
    .game-card p { color:var(--text-muted);font-size:12.5px;line-height:1.5; }
    .game-card .tag { display:inline-block;margin-top:12px;font-family:var(--font-mono);font-size:10px;background:rgba(0,255,200,0.08);border:1px solid rgba(0,255,200,0.2);color:var(--neon-green);padding:3px 10px;border-radius:100px; }
    .game-card.soon { opacity:0.55; pointer-events:none; }
  </style>
  <link rel="stylesheet" href="social.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <header class="topbar">
    <a class="topbar-logo" href="home.html" aria-label="InsertCoin — início"><img class="brand-logo" src="assets/brand.png" alt="">InsertCoin</a>
    <div class="topbar-nav">
      <a class="btn btn-ghost" href="home.html" style="padding:6px 14px;font-size:10px;">← FEED</a>
    </div>
  </header>

  <div class="page-wrap">
<h1>Eventos</h1><section class="card"><h2>Nenhum evento em andamento</h2><p>No momento não há nenhum evento em andamento.</p></section></div><script type="module" src="branding.js"></script></body></html>
